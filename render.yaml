## PayFlow — Render Blueprint
## Deploy everything in one click: https://render.com/docs/blueprint-spec

services:

  # ── FastAPI Web Service ──────────────────────────────────────────────────────
  - type: web
    name: payflow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                          # upgrade to starter/standard for production
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      # ── Secrets — set these in the Render dashboard ─────────────────────────
      - key: API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: PAYU_WEBHOOK_SECRET
        sync: false
      - key: PHONEPE_MERCHANT_ID
        sync: false
      - key: PHONEPE_SALT_KEY
        sync: false
      - key: PHONEPE_SALT_INDEX
        value: "1"

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: payflow-celery-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.workers.tasks.celery_app worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  # ── Celery Beat (scheduler) ──────────────────────────────────────────────────
  - type: worker
    name: payflow-celery-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.workers.tasks.celery_app beat --loglevel=info
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: payflow-redis
          property: connectionString

# ── Managed PostgreSQL ──────────────────────────────────────────────────────────
databases:
  - name: payflow-postgres
    plan: free
    databaseName: payflow
    user: payflow

# ── Managed Redis ───────────────────────────────────────────────────────────────
  - type: redis
    name: payflow-redis
    plan: free
    ipAllowList: []                     # allow all internal connections
